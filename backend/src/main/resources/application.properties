spring.application.name=InterMaps

spring.datasource.url=jdbc:sqlite:intermaps.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite escribe sobre un solo archivo: una unica conexion evita SQLITE_BUSY
spring.datasource.hikari.maximum-pool-size=1

# Instruccion para que Spring se comunique con la sintaxis de SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# El esquema lo define schema.sql (con INTEGER PRIMARY KEY AUTOINCREMENT, que
# el dialecto no genera bien); Hibernate no crea ni altera tablas.
spring.jpa.hibernate.ddl-auto=none

# Ejecutar schema.sql en cada arranque (drop + create) para datos frescos
spring.sql.init.mode=always

# Ver las consultas en consola para depurar
spring.jpa.show-sql=false

# --- CONFIGURACION DE LOGS ---
# Define la ruta y el nombre del archivo (se creara una carpeta 'logs' en tu proyecto)
logging.file.name=logs/intermaps.log

# Nivel de registro (INFO muestra lo importante, ocultando la basura de depuracion profunda)
logging.level.root=INFO

# Politica de rotacion (Vital para hardware embebido)
# Si el archivo llega a 10MB, se comprime y se crea uno nuevo
logging.logback.rollingpolicy.max-file-size=10MB
# Solo guarda los archivos de los ultimos 7 dias, borrando los mas viejos automaticamente
logging.logback.rollingpolicy.max-history=7